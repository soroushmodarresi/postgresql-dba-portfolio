groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Postgres {{ $labels.role }} is down" }
      - alert: ReplicationLagHigh
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Replica lag above 30s", runbook: "docs/runbooks/replica-lag.md" }
      - alert: ConnectionsNearLimit
        expr: sum by (instance) (pg_stat_activity_count) / on (instance) pg_settings_max_connections > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Over 80% of max_connections in use" }
      - alert: DatabaseGrowthFast
        expr: predict_linear(pg_database_size_bytes{datname="appdb"}[1h], 24*3600) > 50e9
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "appdb projected to exceed 50GB within 24h", runbook: "docs/runbooks/disk-full.md" }
      - alert: CacheHitRatioLow
        expr: sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m]))) < 0.90
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Buffer cache hit ratio below 90%" }
