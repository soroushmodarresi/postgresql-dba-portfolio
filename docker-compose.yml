name: dba-portfolio

x-pg-env: &pg-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: appdb
  APP_RW_PASSWORD: ${APP_RW_PASSWORD}
  APP_RO_PASSWORD: ${APP_RO_PASSWORD}
  MONITOR_PASSWORD: ${MONITOR_PASSWORD}
  REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}

services:
  postgres-primary:
    build: ./docker/postgres
    image: dba-portfolio/postgres:16
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment: *pg-env
    ports: ["5432:5432"]
    shm_size: 256mb
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./config/postgres:/etc/postgresql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./tuning:/tuning:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      retries: 30

  postgres-replica:
    image: dba-portfolio/postgres:16
    depends_on:
      postgres-primary: { condition: service_healthy }
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    ports: ["5433:5432"]
    shm_size: 256mb
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./config/postgres:/etc/postgresql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 40

  exporter-primary:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: postgresql://monitor:${MONITOR_PASSWORD}@postgres-primary:5432/appdb?sslmode=disable
    depends_on:
      postgres-primary: { condition: service_healthy }

  exporter-replica:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: postgresql://monitor:${MONITOR_PASSWORD}@postgres-replica:5432/appdb?sslmode=disable
    depends_on:
      postgres-replica: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata-primary:
  pgdata-replica:
  pgbackrest-repo:
  prom-data:
  grafana-data:
