# Separate stack: Patroni + etcd + HAProxy. Run it INSTEAD of the main stack
# (both bind host ports 5000+; stop the main stack first to save RAM).
name: dba-portfolio-ha

x-patroni: &patroni
  build: ./docker/patroni
  volumes:
    - ./config/patroni/patroni.yml:/etc/patroni.yml:ro
  depends_on: [etcd]

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command: >
      etcd --name etcd --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd:2379

  patroni1:
    <<: *patroni
    hostname: patroni1
    environment:
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
    volumes:
      - ./config/patroni/patroni.yml:/etc/patroni.yml:ro
      - pgdata-patroni1:/var/lib/postgresql/data

  patroni2:
    <<: *patroni
    hostname: patroni2
    environment:
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
    volumes:
      - ./config/patroni/patroni.yml:/etc/patroni.yml:ro
      - pgdata-patroni2:/var/lib/postgresql/data

  haproxy:
    image: haproxy:2.9
    ports: ["5000:5000", "5001:5001", "7000:7000"]
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [patroni1, patroni2]

volumes:
  pgdata-patroni1:
  pgdata-patroni2:
