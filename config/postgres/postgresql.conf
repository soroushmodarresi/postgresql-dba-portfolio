# Baseline config. Deliberately untuned (default memory settings) so the
# tuning exercise has a real "before". See tuning/apply_config.sh for "after".
data_directory = '/var/lib/postgresql/data'
hba_file       = '/etc/postgresql/pg_hba.conf'
listen_addresses = '*'
max_connections = 200

# Replication / PITR
wal_level = replica
max_wal_senders = 10
hot_standby = on
wal_keep_size = '512MB'
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'
archive_timeout = 60

# Security
ssl = on
ssl_cert_file = '/etc/ssl/pgcerts/server.crt'
ssl_key_file  = '/etc/ssl/pgcerts/server.key'
password_encryption = scram-sha-256

# Observability
shared_preload_libraries = 'pg_stat_statements,pgaudit'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 500
log_lock_waits = on
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '

# Audit: DDL and role/privilege changes
pgaudit.log = 'ddl, role'
